name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release dry-run for every releasable module
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  docs-boundary:
    name: Documentation boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate documentation boundaries without Go
        run: bash scripts/check-docs.sh --local

  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@eff8b2127c361ee2f422123824a1d337cc277ac4 # v2.1.1
    with:
      tooling_sha: eff8b2127c361ee2f422123824a1d337cc277ac4
      source_bootstrap: false
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}

  required:
    name: Required
    if: always()
    needs: [ci, docs-boundary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DOCS_RESULT: ${{ needs.docs-boundary.result }}
        run: test "${CI_RESULT}" = success && test "${DOCS_RESULT}" = success
