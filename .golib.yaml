schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/control-plane-v5.api

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["./control"]
        run: '^TestServiceExecuteCancelsOnlyBeforeDispatch$'
        count: 1
        timeout: 90s
      - type: go-test
        packages: ["./server"]
        run: '^TestServerBoundsSlowShutdown$'
        count: 1
        race: true
        timeout: 90s
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: integration-postgres
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: integration-queue
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: disaster-recovery-postgres
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: browser
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [./apihttp]
        fuzz: '^FuzzCommandHandlerFailsClosed$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./apihttp]
        fuzz: '^FuzzRecordHandlerFailsClosed$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./apihttp]
        fuzz: '^FuzzQueueHandlerFailsClosed$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmarks
        timeout: 20m
