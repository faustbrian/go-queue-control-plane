schema_version: 1
tool_version: v1.6.2
tool_checksums_sha256: 2a740a44fee468f042b4a66e086fc01a02d8d28877c9b1866e278102665b35ad

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/control-plane.api

operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: integration-postgres
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: integration-queue
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: disaster-recovery-postgres
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: browser
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [./apihttp]
        fuzz: '^FuzzCommandHandlerFailsClosed$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./apihttp]
        fuzz: '^FuzzRecordHandlerFailsClosed$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./apihttp]
        fuzz: '^FuzzQueueHandlerFailsClosed$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmarks
        timeout: 20m
