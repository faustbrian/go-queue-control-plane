schema_version: 1
tool_version: v2.2.0
tool_checksums_sha256: fd4faaa69fb0849b543daaffc43f503432d2d56f61cbc957d68996127a320c30

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports: []

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/control-plane.api

operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: integration-postgres
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: integration-queue
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: disaster-recovery-postgres
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: browser
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
